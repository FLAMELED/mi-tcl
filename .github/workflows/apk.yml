name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # +100: sigue la numeración del repositorio anterior (llegó a la build 21) para que
      # Android acepte instalar encima sin desinstalar.
      BUILD_NUMBER_OFFSET: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build number
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Lint
        run: |
          ./gradlew --no-daemon lintRelease
          echo "::group::Lint errors"
          grep -A4 ": Error:" app/stdout || echo "Sin errores de lint"
          echo "::endgroup::"
          tail -n 1 app/stdout

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MiTCL.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiTCL-apk
          path: MiTCL.apk

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mi-tcl-latest --yes --cleanup-tag || true
          gh release create mi-tcl-latest MiTCL.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Mi TCL (build ${BUILD})" \
            --notes "APK de la app de mando para la TCL 65C6K. Descárgalo desde el móvil e instálalo."
