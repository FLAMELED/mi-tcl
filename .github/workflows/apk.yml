name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # +100: sigue la numeración del repositorio anterior (llegó a la build 21) para que
      # Android acepte instalar encima sin desinstalar.
      BUILD_NUMBER_OFFSET: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto SIGNING_KEYSTORE_BASE64 (Settings › Secrets and variables › Actions)"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/personal.keystore

      - name: Check signing secrets
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # Diagnóstico sin revelar secretos: huella del archivo de clave y si la contraseña lo abre.
          echo "Huella de la clave: $(sha256sum app/personal.keystore | cut -c1-16)"
          PASS="$(printf '%s' "$SIGNING_PASSWORD" | tr -d '[:space:]')"
          echo "Longitud de la contraseña: ${#PASS}"
          if keytool -list -keystore app/personal.keystore -storepass "$PASS" >/dev/null 2>&1; then
            echo "La contraseña abre la clave"
          else
            echo "::error::SIGNING_PASSWORD no abre la clave de SIGNING_KEYSTORE_BASE64"
            exit 1
          fi

      - name: Build number
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Lint
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew --no-daemon lintRelease
          echo "::group::Lint errors"
          grep -A4 ": Error:" app/stdout || echo "Sin errores de lint"
          echo "::endgroup::"
          tail -n 1 app/stdout

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MiTCL.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiTCL-apk
          path: MiTCL.apk

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mi-tcl-latest --yes --cleanup-tag || true
          gh release create mi-tcl-latest MiTCL.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Mi TCL (build ${BUILD})" \
            --notes "APK de la app de mando para la TCL 65C6K. Descárgalo desde el móvil e instálalo."
